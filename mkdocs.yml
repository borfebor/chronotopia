site_name: Chronotopia
site_description: Analysis of time-course data for circadian biology
site_url: https://borfebor.github.io/chronotopia/
repo_url: https://github.com/borfebor/chronotopia
repo_name: borfebor/chronotopia
edit_uri: edit/main/docs/

# `docs.py` (the in-app tooltip module) and this `docs/` directory sit in the
# same folder. Python resolves a regular module ahead of a namespace package, so
# `import docs` still finds docs.py — but do NOT add docs/__init__.py, which
# would flip the resolution and break the app at startup. There is a check for
# this in docs/check_docs.py.
docs_dir: docs

# `docs/` holds three build scripts alongside the pages, because they are run as
# `python docs/make_figures.py` from the repository root and moving them would
# break every reference. They are tooling, not content, so they are excluded from
# the built site rather than copied into it.
exclude_docs: |
  *.py
  .DS_Store

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/tab_logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  # Renders the :material-xxx: shortcodes used in the cards and download rows.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/borfebor/chronotopia

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your data: getting-started/data-format.md
  - Preprocessing: preprocessing.md
  - Feature extraction: features.md
  - Tutorials:
      - Overview: tutorials/index.md
      - 1 · Short time series: tutorials/short-series.md
      - 2 · Long time series: tutorials/long-series.md
  - Reference:
      - Control reference: reference/controls.md
      - Reproducibility: reference/reproducibility.md
      - Citing Chronotopia: reference/citing.md
      - Changelog: reference/changelog.md

watch:
  - tutorials
