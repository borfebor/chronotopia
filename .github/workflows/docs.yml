name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tutorials/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # The figures are rendered from these, so a change here can change them.
      - "methods.py"
      - "plates.py"
      - "styles.py"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The figure script imports methods.py and styles.py, so the app's own
          # numeric dependencies are needed — but not rpy2, which needs R and is
          # only used by MetaCycle.
          pip install numpy pandas scipy matplotlib seaborn statsmodels pyboat astropy streamlit
          pip install -r requirements-docs.txt

      - name: Check the docs/ directory has not shadowed docs.py
        run: python docs/check_docs.py

      - name: Verify the tutorial datasets still behave as documented
        run: python tutorials/verify_tutorial_data.py

      - name: Generate the control reference from docs.py
        run: python docs/gen_control_reference.py

      - name: Render figures and stage datasets
        run: python docs/make_figures.py

      - name: Fail if a committed figure is stale
        run: |
          if ! git diff --quiet -- docs/assets/figures; then
            echo "::error::Committed figures differ from freshly rendered ones."
            echo "Run 'python docs/make_figures.py' and commit the result."
            git diff --stat -- docs/assets/figures
            exit 1
          fi

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
